<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">All-season car tire</title>
  <desc id="desc">A black all-season tire with a silver alloy wheel and detailed tread.</desc>
  <defs>
    <radialGradient id="rubber" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#454545"/>
      <stop offset=".38" stop-color="#252525"/>
      <stop offset=".78" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="sidewall" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#292929"/>
      <stop offset=".7" stop-color="#151515"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="rim" x1="15%" y1="12%" x2="88%" y2="90%">
      <stop offset="0" stop-color="#f1f1ed"/>
      <stop offset=".25" stop-color="#aeb1b3"/>
      <stop offset=".5" stop-color="#f7f7f3"/>
      <stop offset=".76" stop-color="#777c80"/>
      <stop offset="1" stop-color="#d4d5d2"/>
    </linearGradient>
    <radialGradient id="hub" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#f4f4f0"/>
      <stop offset=".55" stop-color="#929699"/>
      <stop offset="1" stop-color="#44484b"/>
    </radialGradient>
    <pattern id="tread" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M4 0v36M18 0v36M32 0v36" stroke="#505050" stroke-width="5"/>
      <path d="M10 0v36M25 0v36" stroke="#080808" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <ellipse cx="258" cy="426" rx="162" ry="22" fill="#000" opacity=".24" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="225" fill="url(#rubber)" stroke="#050505" stroke-width="8"/>
  <circle cx="250" cy="250" r="211" fill="none" stroke="#070707" stroke-width="20"/>
  <circle cx="250" cy="250" r="199" fill="none" stroke="#383838" stroke-width="10" stroke-dasharray="22 7"/>
  <circle cx="250" cy="250" r="186" fill="none" stroke="#101010" stroke-width="9"/>
  <circle cx="250" cy="250" r="176" fill="url(#tread)" stroke="#303030" stroke-width="4"/>
  <circle cx="250" cy="250" r="158" fill="url(#sidewall)" stroke="#3b3b3b" stroke-width="3"/>
  <circle cx="250" cy="250" r="145" fill="none" stroke="#090909" stroke-width="4"/>
  <circle cx="250" cy="250" r="132" fill="url(#rim)" stroke="#080808" stroke-width="10"/>
  <circle cx="250" cy="250" r="113" fill="#4e5356" stroke="#f0f0ec" stroke-width="4"/>
  <g fill="url(#rim)" stroke="#565b5e" stroke-width="4">
    <path d="M241 148h18l17 79-18 17-18-17z"/>
    <path d="M241 148h18l17 79-18 17-18-17z" transform="rotate(72 250 250)"/>
    <path d="M241 148h18l17 79-18 17-18-17z" transform="rotate(144 250 250)"/>
    <path d="M241 148h18l17 79-18 17-18-17z" transform="rotate(216 250 250)"/>
    <path d="M241 148h18l17 79-18 17-18-17z" transform="rotate(288 250 250)"/>
  </g>
  <circle cx="250" cy="250" r="49" fill="url(#hub)" stroke="#303437" stroke-width="5"/>
  <circle cx="250" cy="250" r="28" fill="#272b2e" stroke="#e2e3df" stroke-width="5"/>
  <circle cx="250" cy="250" r="11" fill="#b9bcb9"/>
  <g fill="#24282a" stroke="#d6d7d3" stroke-width="2">
    <circle cx="250" cy="211" r="5"/>
    <circle cx="287" cy="238" r="5"/>
    <circle cx="273" cy="281" r="5"/>
    <circle cx="227" cy="281" r="5"/>
    <circle cx="213" cy="238" r="5"/>
  </g>
  <circle cx="250" cy="250" r="154" fill="none" stroke="#555" stroke-width="2" opacity=".5"/>
  <path d="M250 102a148 148 0 0 1 105 44" fill="none" stroke="#777" stroke-width="3" opacity=".38"/>
</svg>
